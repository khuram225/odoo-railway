[options]
; Odoo 19 Community on Railway.
;
; `admin_passwd` is deliberately NOT in this file. It is the one secret in the
; Odoo config, so the entrypoint appends it from $ODOO_ADMIN_PASSWD at boot.
;
; Database connection settings are also absent on purpose: the image's own
; entrypoint skips them when PGHOST/PGPORT/PGUSER/PGPASSWORD are set, and
; psycopg2 then picks the connection up from libpq. That matters on Railway,
; because the image reads $PORT as the *PostgreSQL* port.

data_dir = /var/lib/odoo
addons_path = /mnt/extra-addons

; --- Listeners -------------------------------------------------------------
; 8069 serves everything except /websocket. In the multi-processing server the
; websocket bus is served ONLY by the gevent worker on 8072, so the proxy in
; front of this service has to route /websocket there. See proxy/nginx.conf.
http_interface = 0.0.0.0
http_port = 8069
gevent_port = 8072

; Trust X-Forwarded-* from the proxy. Odoo uses werkzeug ProxyFix(x_for=1),
; which reads the RIGHTMOST X-Forwarded-For entry, and it only engages at all
; when X-Forwarded-Host is present. Both are handled in proxy/nginx.conf.
proxy_mode = True

; --- Process model ---------------------------------------------------------
; workers > 0 selects the multi-processing server, which is the production one.
; workers = 0 (the image default) is the multi-threaded development server.
; Sized for memory, not CPU: limits below are per process, and this runs
; workers + max_cron_threads + 1 gevent = 4 processes.
workers = 2
max_cron_threads = 1

; --- Connection budget -----------------------------------------------------
; Odoo defaults to 64 connections PER PROCESS. Railway's managed PostgreSQL
; allows 100 in total, so the default would budget 4 x 64 = 256. 4 x 8 = 32.
db_maxconn = 8
db_maxconn_gevent = 8

; --- Resource limits -------------------------------------------------------
; These are absolute byte values, not container-aware: the defaults (2 GiB soft
; / 2.5 GiB hard per worker) would budget ~10 GiB inside an 8 GiB container.
limit_memory_soft = 1073741824
limit_memory_hard = 1342177280
limit_request = 8192
limit_time_cpu = 600
limit_time_real = 1200
limit_time_real_cron = 1800

; --- Single tenant + locked-down database manager --------------------------
; db_name makes Odoo create AND install the database on first boot (see the
; entrypoint's notes). dbfilter pins request routing to it. list_db = False
; disables the database manager screens.
db_name = odoo
dbfilter = ^odoo$
list_db = False
without_demo = True

log_level = info
