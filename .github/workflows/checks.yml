name: checks

# Every push to main, and every pull request into it. Railway's "Wait for
# CI" waits on the `all checks` status at the bottom, which only passes
# when BOTH the static suite and the boot test have passed.
on:
  push:
    # verify/** is a standing allowance, not a leftover: a change to a
    # gate has to be provable on a branch before it reaches main, since
    # main is what Railway deploys from.
    branches: [main, 'verify/**']
  pull_request:
    branches: [main]

# A second push to main supersedes the first: the older run's answer is
# about a commit nobody is deploying any more.
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # =====================================================================
  # Everything that can be decided by reading the code.
  # =====================================================================
  static:
    name: static checks
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out this repo
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install what the checks need
        # pulp is PINNED to match odoo/Dockerfile exactly. 4.x is a
        # rewrite with no bundled solver, so an unpinned install would
        # silently drop the cutting optimiser to its greedy fallback and
        # CI would be testing a different algorithm from production.
        run: python -m pip install --upgrade pip pyflakes lxml pulp==2.9.0

      # The checks read ../odoo-src to know what core Odoo defines: which
      # fields a product has, which methods BaseModel provides, Odoo's own
      # RelaxNG schemas. Without it ten of them skip, and --strict turns a
      # skip into a failure, so this clone is not optional: it is what
      # makes the run mean anything.
      #
      # Cloned fresh every run, NOT cached. actions/cache resolves a
      # relative path against the workspace and this one sits outside it,
      # and a cache that restores EMPTY is precisely the "looks green,
      # read nothing" failure this whole suite exists to stop.
      - name: Clone Odoo 19.0 source
        run: |
          git clone --depth 1 --single-branch --branch 19.0 \
            https://github.com/odoo/odoo.git ../odoo-src

      - name: Confirm the source clone is really there
        run: |
          test -d ../odoo-src/odoo/addons/base/rng \
            || { echo "::error::../odoo-src is missing or incomplete"; exit 1; }

      - name: Run every check
        run: sh scripts/check_all.sh --strict

  # =====================================================================
  # The gate no static check can be: does the application actually exist?
  #
  # A static check reads code. It cannot tell you that the module graph
  # builds, that every data file loads, or that the views install against
  # the models they name -- and that gap is not theoretical. An
  # `_inherit = 'aw.design'` in a module that cannot see aw.design passed
  # the whole static suite, deployed, and left every request returning 500
  # while the container stayed up and /web/health went on answering 200.
  #
  # So: a real Odoo, a real Postgres, two fresh databases, one install
  # each. If the registry will not build, this fails.
  # =====================================================================
  boot:
    name: boot test
    runs-on: ubuntu-latest
    # Two installs plus two server starts, one of them on a cold registry
    # over ~500 imported products. 25 was tight enough that a slow start
    # would read as a failure.
    timeout-minutes: 40

    # The EXACT image odoo/Dockerfile deploys. Testing the install against
    # a different Odoo than production runs would be testing something
    # else.
    container:
      image: odoo:19.0-20260723
      options: --user root

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: odoo
          POSTGRES_PASSWORD: odoo
          POSTGRES_DB: postgres
        options: >-
          --health-cmd "pg_isready -U odoo"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      PGHOST: postgres
      PGUSER: odoo
      PGPASSWORD: odoo

    steps:
      - name: Check out this repo
        uses: actions/checkout@v4

      - name: Which modules are there
        id: modules
        # Discovered, not listed, and split on the TENANCY boundary --
        # the same one the two Railway services use. A module added
        # tomorrow is installed by this job without anyone editing it,
        # which is the whole lesson of the hardcoded-list failures.
        run: |
          set -eu
          aluminum=$(find odoo/addons -name __manifest__.py \
            -not -path 'odoo/addons/addons_print/*' \
            -printf '%h\n' | xargs -n1 basename | sort | paste -sd, -)
          print=$(find odoo/addons/addons_print -name __manifest__.py \
            -printf '%h\n' 2>/dev/null | xargs -n1 basename | sort | paste -sd, -)
          echo "aluminum=$aluminum" >> "$GITHUB_OUTPUT"
          echo "print=$print" >> "$GITHUB_OUTPUT"
          echo "aluminum: $aluminum"
          echo "print:    $print"
          # As an annotation, which is what the check-runs API hands back
          # without a token. A discovery that quietly found nothing is
          # how a hardcoded list used to pass while skipping new code.
          echo "::notice::installing aluminum=[$aluminum] print=[$print]"
          {
            echo "### modules discovered"
            echo
            echo "- aluminum: \`$aluminum\`"
            echo "- print: \`$print\`"
          } >> "$GITHUB_STEP_SUMMARY"
          test -n "$aluminum" || {
            echo "::error::no aluminum modules discovered -- this job would" \
                 "have installed nothing and passed"; exit 1; }

      # --------------------------------------------------------------
      # Fresh database 1: the aluminum tenant.
      # --------------------------------------------------------------
      - name: Install the aluminum modules into a fresh database
        run: |
          set -eu
          odoo -d aw_boot \
            --addons-path=/usr/lib/python3/dist-packages/odoo/addons,odoo/addons \
            -i "${{ steps.modules.outputs.aluminum }}" \
            --without-demo=all --stop-after-init --no-http \
            --log-level=info 2>&1 | tee /tmp/aw_boot.log

      - name: Fail on any error in the aluminum install
        # --stop-after-init exits 0 for some failures that are only
        # LOGGED, so the exit code alone is not the gate. Both are.
        run: sh scripts/ci_assert_clean_log.sh /tmp/aw_boot.log

      # --------------------------------------------------------------
      # Fresh database 2: the print tenant, on ITS OWN addons path.
      # Only addons_print, exactly as the print service loads it -- so a
      # pp_* module that reached for an aw_* one fails HERE, where the
      # development instance would never notice.
      # --------------------------------------------------------------
      - name: Install the print modules into a second fresh database
        if: steps.modules.outputs.print != ''
        run: |
          set -eu
          odoo -d pp_boot \
            --addons-path=/usr/lib/python3/dist-packages/odoo/addons,odoo/addons/addons_print \
            -i "${{ steps.modules.outputs.print }}" \
            --without-demo=all --stop-after-init --no-http \
            --log-level=info 2>&1 | tee /tmp/pp_boot.log

      - name: Fail on any error in the print install
        if: steps.modules.outputs.print != ''
        run: sh scripts/ci_assert_clean_log.sh /tmp/pp_boot.log

      # --------------------------------------------------------------
      # And the healthcheck itself, against the database just built.
      # Verifying the route here is the difference between believing it
      # reports a broken registry and knowing it does.
      # --------------------------------------------------------------
      - name: Both health routes answer 200 on a good, upgraded build
        run: |
          sh scripts/ci_check_health_route.sh aw_boot \
            /aw/health/registry=200 /aw/health=200

      # --------------------------------------------------------------
      # THE REASON THE TWO ROUTES ARE SEPARATE, asserted rather than
      # explained. Railway holds the old container until the new one is
      # healthy, and the Upgrade is run FROM the new one -- so a
      # healthcheck that demands upgraded columns deadlocks every
      # schema-changing release.
      #
      # Dropping a column reproduces exactly that state: new code, old
      # schema. /aw/health/registry must still say 200 (it is what lets
      # the deploy go healthy so the Upgrade can be run at all) and
      # /aw/health must say 500 (there really is a missing column).
      # --------------------------------------------------------------
      - name: A missing column fails the deep probe and NOT the healthcheck
        run: |
          set -eu
          # psycopg2, not psql: the odoo image is not documented to carry
          # postgresql-client and this repo's Dockerfile does not add it,
          # whereas psycopg2 is a hard requirement of Odoo itself. A gate
          # that goes red because a client binary is missing is noise.
          python3 - <<'PY'
          import os
          import psycopg2
          cn = psycopg2.connect(dbname='aw_boot', host=os.environ['PGHOST'],
                                user=os.environ['PGUSER'],
                                password=os.environ['PGPASSWORD'])
          cn.autocommit = True
          with cn.cursor() as cr:
              cr.execute('ALTER TABLE aw_design DROP COLUMN finish_id')
          print('dropped column aw_design.finish_id')
          PY
          sh scripts/ci_check_health_route.sh aw_boot \
            /aw/health/registry=200 \
            '/aw/health=500@column aw_design.finish_id does not exist'

      # --------------------------------------------------------------
      # A healthcheck that only ever returns 200 has not been tested.
      # This BREAKS the registry on purpose -- the exact 7549098 fault,
      # an `_inherit` of a model the declaring module cannot see -- and
      # requires the route to say 500. No upgrade is run, because that is
      # the real case: a deploy ships new code onto a database that is
      # already installed.
      #
      # It runs on every push, not on a one-off verification branch,
      # because a gate is only trustworthy while something keeps proving
      # it still fails. It is the LAST step, so the sabotaged working
      # tree cannot affect anything else.
      # --------------------------------------------------------------
      - name: And BOTH return 500 when the registry is deliberately broken
        run: |
          set -eu
          sh scripts/ci_break_registry.sh
          # Both, including the healthcheck: a registry that will not build
          # is the one failure Railway must never call healthy, and it is
          # the failure that shipped green once already.
          sh scripts/ci_check_health_route.sh aw_boot \
            /aw/health/registry=500 /aw/health=500

      # The static suite must also catch this by reading the code, which
      # is the cheap gate that should have stopped 7549098 in the first
      # place. Asserted on the sabotaged tree, where it has to FAIL.
      - name: The static check for this fault catches it too
        run: |
          set -eu
          if python3 scripts/check_cross_module_inherit.py > /tmp/inherit.txt 2>&1; then
            cat /tmp/inherit.txt
            echo "::error::check_cross_module_inherit.py PASSED on a tree with" \
                 "the 7549098 break in it -- the static gate is not working"
            exit 1
          fi
          cat /tmp/inherit.txt
          # It must reject it for the RIGHT reason: a crash, a missing
          # odoo-src, any non-zero exit would otherwise read as "caught".
          grep -q "extends 'aw.design'" /tmp/inherit.txt || {
            echo "::error::the check failed, but not because of the injected" \
                 "break -- so it is not what caught it"; exit 1; }
          echo "::notice::static check correctly rejected the sabotaged tree: $(
            grep -o "extends 'aw.design'[^.]*" /tmp/inherit.txt | head -1)"
          {
            echo "### static check on the sabotaged tree: correctly rejected"
            echo
            echo '```'
            head -4 /tmp/inherit.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "ok: the static check rejected the broken tree, naming the fault"

  # =====================================================================
  # The single status Railway waits on. It has no steps: its only job is
  # to be red unless both of the above are green, so one status name
  # covers both and adding a third job later needs one line here.
  # =====================================================================
  all-checks:
    name: all checks
    runs-on: ubuntu-latest
    needs: [static, boot]
    if: always()
    steps:
      - name: Require both gates
        run: |
          echo "static: ${{ needs.static.result }}"
          echo "boot:   ${{ needs.boot.result }}"
          test "${{ needs.static.result }}" = "success" \
            && test "${{ needs.boot.result }}" = "success" \
            || { echo "::error::a gate did not pass"; exit 1; }
