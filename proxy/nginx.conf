# Reverse proxy in front of the Odoo service.
#
# It exists for one reason: Odoo's production (multi-processing) server serves
# /websocket ONLY from its gevent worker on port 8072, while everything else is
# served by the prefork HTTP workers on 8069. A prefork worker that receives a
# websocket upgrade raises:
#     RuntimeError: Couldn't bind the websocket.
#                   Is the connection opened on the evented port (8072)?
# Railway's edge routes by domain -> target port and has no path-based routing,
# so the split has to happen here.
#
# __RESOLVER__ and __ODOO_HOST__ are substituted by entrypoint.sh at boot.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Railway's edge sends TWO X-Forwarded-For entries: "<real client>, <edge>".
# Odoo's proxy_mode uses werkzeug ProxyFix(x_for=1), which reads the RIGHTMOST
# entry -- that would be Railway's own address, not the user's, and because it
# is a public IP it looks plausible in logs. Collapse the header to its
# leftmost entry, which the edge sets and a client cannot forge (a
# client-supplied X-Forwarded-For is discarded upstream).
#
# Do NOT use nginx's usual $proxy_add_x_forwarded_for here: it appends this
# proxy's own private address, making the rightmost entry worse still.
map $http_x_forwarded_for $real_client_ip {
    "~^\s*(?P<first>[^,\s]+)" $first;
    default                   $remote_addr;
}

server {
    listen 8080 default_server;
    server_name _;

    # Resolve the upstream at request time, not at startup. A static
    # `upstream {}` block resolves once, so this proxy would pin a stale
    # container IP after every redeploy of the Odoo service and serve 502
    # until nginx itself restarted.
    resolver __RESOLVER__ valid=10s;
    set $odoo_http "__ODOO_HOST__:8069";
    set $odoo_ws   "__ODOO_HOST__:8072";

    # Attachments and module uploads.
    client_max_body_size 128m;

    # Long-running reports and module installs.
    proxy_read_timeout 720s;
    proxy_connect_timeout 75s;
    proxy_send_timeout 720s;
    proxy_http_version 1.1;

    proxy_set_header Host              $http_host;
    # proxy_mode only engages in Odoo when X-Forwarded-Host is present.
    proxy_set_header X-Forwarded-Host  $http_host;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_set_header X-Forwarded-For   $real_client_ip;
    proxy_set_header X-Real-IP         $real_client_ip;

    # TLS terminates at Railway's edge, so mark the session cookie accordingly.
    proxy_cookie_flags session_id samesite=lax secure;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    gzip on;
    gzip_proxied any;
    gzip_types text/css text/plain text/xml application/xml application/json
               application/javascript image/svg+xml;

    # This proxy's OWN health check. It must not touch the upstream: Railway
    # starts services in no particular order, and while the Odoo container is
    # absent `odoo.railway.internal` does not resolve at all, so a health check
    # that proxied would 502 and fail this service's deploy for a fault that
    # belongs to a different service.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Websocket bus -> gevent worker.
    location /websocket {
        proxy_pass http://$odoo_ws$request_uri;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    # Everything else -> HTTP workers.
    # A proxy_pass containing a variable does not append the request URI
    # automatically, hence the explicit $request_uri on both locations.
    location / {
        proxy_pass http://$odoo_http$request_uri;
        proxy_redirect off;
    }
}
